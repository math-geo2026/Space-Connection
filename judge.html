<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공간잇기 — 심사용 입장</title>
<script src="kosa.js?v=3"></script>
<style>
body{margin:0;background:#0b1424;color:#dbe7f7;font-family:'Noto Sans KR',-apple-system,sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.box{background:#111e33;border:1px solid #223a60;border-radius:14px;padding:32px 28px;max-width:380px;width:100%;
  box-shadow:0 8px 30px rgba(0,0,0,.4);text-align:center}
.box h1{font-size:19px;margin:0 0 10px}
.box p{color:#8fa8c8;font-size:13px;line-height:1.7;margin:0 0 22px}
.box button{width:100%;background:#5599ff;border:none;border-radius:9px;color:#06111f;font-weight:900;
  padding:13px 12px;font-size:15px;cursor:pointer;margin-bottom:10px}
.box .alt{background:transparent;border:1px solid #2e4d78;color:#9ec5ff;font-weight:700}
</style>
</head>
<body>
<div class="box">
  <h1>🛰️ 공간잇기 — 심사용 입장</h1>
  <p>학생들이 실제로 보는 화면 그대로, <b>모든 단계 잠금이 풀린 상태</b>로 들어갑니다.<br>
  사령부에서 원하는 모듈·단계를 자유롭게 눌러보실 수 있어요.<br>
  (학번 <code>99999</code> · 이름 "심사용"으로 접속되며, 활동 기록은 교사용 통계에서 자동으로 제외됩니다)</p>
  <button onclick="enter('hub.html')">🧭 사령부로 시작</button>
  <button class="alt" onclick="location.href='index.html?judge=1'">🛰️ 대문(로그인 화면)부터 보기</button>
  <button class="alt" onclick="if(KOSA.DASH_URL) window.open(KOSA.DASH_URL,'_blank'); else alert('대시보드 주소가 설정되어 있지 않습니다.');">📊 교사용 대시보드</button>
</div>
<script>
function enter(file){
  KOSA.setUser('99999','심사용');
  window.location.href = file + '?judge=1';
}
</script>
</body></html>
